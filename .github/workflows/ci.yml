name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write # actions/cache save (venv + setup-uv) requires write on the actions scope

defaults:
  run:
    shell: pwsh

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: unscreen-venv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            unscreen-venv-${{ runner.os }}-

  lint:
    runs-on: windows-latest
    needs: prepare
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Restore cached environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: unscreen-venv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            unscreen-venv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run pyright
        run: uv run pyright src/

  test:
    runs-on: windows-latest
    needs: prepare
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Restore cached environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: unscreen-venv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            unscreen-venv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short -q

  detect-version-bump:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.current_version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect version bump
        id: detect
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          python scripts/ci/release_metadata.py detect-version-bump \
            --pyproject pyproject.toml \
            --before "$EVENT_BEFORE"

  build-windows:
    runs-on: windows-latest
    needs: [lint, test, detect-version-bump]
    if: needs.detect-version-bump.outputs.should_release == 'true'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "."
          pip install flet-cli

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows EXE
        run: |
          chcp 65001 > $null
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $env:CMAKE_TLS_VERIFY = "0"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          flet build windows --yes --skip-flutter-doctor --no-rich-output

      - name: Package portable ZIP and installer
        id: collect
        run: |
          $allExeCandidates = @(Get-ChildItem -Path build, dist -Recurse -Filter *.exe -File -ErrorAction SilentlyContinue)
          $allExeCandidates = $allExeCandidates | Where-Object {
            $_.Name -notin @("python.exe", "pythonw.exe", "flet.exe", "httpx.exe") -and
            $_.FullName -notmatch "\\site-packages\\bin\\" -and
            $_.FullName -notmatch "\\CompilerId" -and
            $_.FullName -notmatch "\\build_python_" -and
            $_.FullName -notmatch "\\python\\"
          }
          $exe = $allExeCandidates |
            Where-Object { $_.DirectoryName -match "\\build\\windows$" } |
            Select-Object -First 1
          if (-not $exe) {
            $exe = $allExeCandidates |
              Where-Object { $_.DirectoryName -match "\\build\\flutter\\build\\windows\\x64\\runner\\Release$" } |
              Select-Object -First 1
          }
          if (-not $exe) {
            $exe = $allExeCandidates | Select-Object -First 1
          }
          if (-not $exe) {
            throw "No application .exe output found."
          }
          $bundleDir = $exe.DirectoryName
          $appVersion = "${{ needs.detect-version-bump.outputs.version }}"
          $portableName = "Unscreen-$appVersion-portable.zip"
          if (Test-Path $portableName) {
            Remove-Item $portableName -Force
          }
          Compress-Archive -Path (Join-Path $bundleDir "*") -DestinationPath $portableName -CompressionLevel Optimal
          $installerName = "Unscreen-$appVersion-setup.exe"
          $isccPath = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccFromPath = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
            if ($isccFromPath) {
              $isccPath = $isccFromPath
            } else {
              throw "ISCC.exe not found after installing Inno Setup."
            }
          }
          & $isccPath "/DMyAppVersion=$appVersion" "/DMyAppExeName=$($exe.Name)" "/DBundleDir=$bundleDir" "/O$($PWD.Path)" packaging\windows\installer.iss
          if (-not (Test-Path $installerName)) {
            throw "Installer was not produced at expected path: $installerName"
          }
          "portable_path=$portableName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer_path=$installerName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.detect-version-bump.outputs.version }}-windows
          path: |
            ${{ steps.collect.outputs.portable_path }}
            ${{ steps.collect.outputs.installer_path }}

  build-android:
    runs-on: ubuntu-latest
    needs: [lint, test, detect-version-bump]
    if: needs.detect-version-bump.outputs.should_release == 'true'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install project and Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install flet-cli

      - name: Build Android APK
        run: |
          flet build apk --yes --build-number "${{ github.run_number }}" --skip-flutter-doctor --no-rich-output

      - name: Decode Android keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      - name: Install Android build tools
        shell: bash
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Locate APK
        id: locate_apk
        run: |
          $candidateDirs = @("build", "dist")
          $apks = @()
          foreach ($dir in $candidateDirs) {
            if (Test-Path $dir) {
              $apks += Get-ChildItem -Path $dir -Recurse -Filter *.apk -File
            }
          }
          if ($apks.Count -eq 0) {
            throw "No .apk output found in build/ or dist/."
          }
          $apk = $apks | Select-Object -First 1
          Write-Host "Discovered APK: $($apk.FullName)"
          "apk_path=$($apk.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Align APK
        shell: bash
        run: |
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/zipalign" -f -p 4 "${{ steps.locate_apk.outputs.apk_path }}" aligned.apk

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cp aligned.apk signed.apk
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            signed.apk

      - name: Verify signed APK
        shell: bash
        run: |
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify signed.apk

      - name: Print signing certificate
        shell: bash
        run: |
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner" verify --print-certs signed.apk

      - name: Collect APK
        id: collect
        run: |
          $newApkName = "Unscreen-${{ needs.detect-version-bump.outputs.version }}.apk"
          if (-not (Test-Path "signed.apk")) {
            throw "Signed APK not found."
          }
          Move-Item -Path "signed.apk" -Destination $newApkName -Force
          "path=$newApkName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.detect-version-bump.outputs.version }}-android
          path: ${{ steps.collect.outputs.path }}

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - lint
      - detect-version-bump
      - build-windows
      - build-android
    if: needs.detect-version-bump.outputs.should_release == 'true'
    timeout-minutes: 10

    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.detect-version-bump.outputs.tag }}
          name: Release ${{ needs.detect-version-bump.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.detect-version-bump.outputs.version, '-') }}

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.detect-version-bump.outputs.version }}-windows
          path: release-assets

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.detect-version-bump.outputs.version }}-android
          path: release-assets

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.detect-version-bump.outputs.tag }}
          files: |
            release-assets/*-portable.zip
            release-assets/*-setup.exe
            release-assets/*.apk
