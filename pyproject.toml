[project]
name = "unscreen"
version = "0.5.1-dev7"
description = "Cross-device app usage timeline tracker"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Sakth1", email = "sakthimurugankgm@gmail.com" }
]
dependencies = [
    "flet>=0.86.2",
    "orjson>=3.11.9",
    "psutil>=7.2.2",
    "publicsuffixlist>=1.0.2",
    "rich>=15.0.0",
    'lz4>=4.3; platform_system=="Windows"',
    'pywinauto>=0.6.8; platform_system=="Windows"',
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.2",
    "flet-desktop>=0.86.2",
    "flet-web>=0.86.2",
    "pytest>=9.1",
    "pytest-asyncio>=0.25",
    "ruff>=0.16.0",
    "pyright>=1.1.0",
    "black>=26.5.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.165.9",
]
e2e = [
    "flet[test]>=0.86.2",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "scikit-image>=0.25.2",
]

[project.scripts]
check = "_check_runner:main"

[tool.uv]
package = true

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["src/trial and error"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018", "SIM105", "SIM115", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = [
    "--ignore=tests/e2e",
    "--ignore=tests/chaos",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=60",
]
markers = [
    "e2e: end-to-end UI tests driven by flet.testing (require a Flutter test host; run via the e2e dependency group)",
    "chaos: adversarial mindless-user suite (callable fuzz, headless UI chaos, runtime chaos, e2e chaos; run via the chaos marker)",
]

[tool.coverage.run]
omit = [
    "src/UIold/*",
]

[tool.flet]
org = "com.mycompany"
product = "unscreen"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"

[tool.flet.android]
split_per_abi = true
compile_packages = true
manifest_application = { allowBackup = "true" }
dependencies = [
    "flet>=0.86.2",
    "orjson>=3.11.9",
    "psutil>=7.2.2",
    "pyjnius",
    "rich>=15.0.0",
]

[tool.flet.android.permission]
"android.permission.PACKAGE_USAGE_STATS" = true
"android.permission.REQUEST_INSTALL_PACKAGES" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = { maxSdkVersion = "28" }
"android.permission.READ_EXTERNAL_STORAGE" = { maxSdkVersion = "32" }

[tool.unscreen.release]
binary_name = "Unscreen"
